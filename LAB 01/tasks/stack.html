
<!DOCTYPE html>
<html>
<head>
    <title>Stack Visualizer</title>

    <link rel="stylesheet" href="stack.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<div class="container">

    <h1>Stack</h1>

    <p>Click a value to Push into Stack</p>
    <p>Click a Stack item to Pop it</p>

    <button class="btn">10</button>
    <button class="btn">20</button>
    <button class="btn">30</button>
    <button class="btn">40</button>
    <button class="btn">50</button>

    <div id="stack"></div>

    <p id="msg"></p>

</div>

<script src="stack.js"></script>

</body>
</html>
