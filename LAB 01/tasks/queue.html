
<!DOCTYPE html>
<html>
<head>
    <title>Queue Visualizer</title>

    <link rel="stylesheet" href="queue.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<div class="container">

    <h1>Queue</h1>

    <p>Click a value to Enqueue into Queue</p>
    <p>Click a Queue item to Dequeue it</p>

    <button class="btn">10</button>
    <button class="btn">20</button>
    <button class="btn">30</button>
    <button class="btn">40</button>
    <button class="btn">50</button>

    <div id="queue"></div>

    <p id="msg"></p>

</div>

<script src="queue.js"></script>

</body>
</html>
